apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-demo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cgsunshine/gitops-manifests.git
    targetRevision: main
    path: envs/dev/go-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true