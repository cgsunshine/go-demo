name: ci-cd

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cgsunshine/go-demo
  GITOPS_REPO: cgsunshine/gitops-manifests

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set env target
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
            echo "replicas=2" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "replicas=1" >> "$GITHUB_OUTPUT"
            echo "image_tag=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.deploy_env }}

      - name: Checkout gitops manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update env manifests
        env:
          DEPLOY_ENV: ${{ steps.meta.outputs.deploy_env }}
          APP_ENV: ${{ steps.meta.outputs.app_env }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          REPLICAS: ${{ steps.meta.outputs.replicas }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        shell: bash
        run: |
          mkdir -p "gitops/envs/${DEPLOY_ENV}/go-demo"
          cat > "gitops/envs/${DEPLOY_ENV}/go-demo/all.yaml" <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: go-demo
            labels:
              app: go-demo
              env: ${APP_ENV}
          spec:
            replicas: ${REPLICAS}
            selector:
              matchLabels:
                app: go-demo
            template:
              metadata:
                labels:
                  app: go-demo
                  env: ${APP_ENV}
              spec:
                containers:
                  - name: web
                    image: ${IMAGE_NAME}:${IMAGE_TAG}
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: APP_VERSION
                        value: "${IMAGE_TAG}"
                      - name: APP_ENV
                        value: "${APP_ENV}"
                    ports:
                      - containerPort: 8080
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8080
                      initialDelaySeconds: 1
                      periodSeconds: 5
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: go-demo
            labels:
              app: go-demo
          spec:
            selector:
              app: go-demo
            ports:
              - port: 80
                targetPort: 8080
          EOF
          sed -i 's/^          //' "gitops/envs/${DEPLOY_ENV}/go-demo/all.yaml"
          echo "Wrote manifests for ${DEPLOY_ENV} -> ${IMAGE_NAME}:${IMAGE_TAG}"
          cat "gitops/envs/${DEPLOY_ENV}/go-demo/all.yaml"

      - name: Commit and push gitops
        working-directory: gitops
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "envs/${{ steps.meta.outputs.deploy_env }}/go-demo/all.yaml"
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "ci(${{ steps.meta.outputs.deploy_env }}): go-demo ${{ steps.meta.outputs.image_tag }}"
          git push